name: Windows build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src/HashMe.Core/HashMe.Core.csproj
          dotnet restore src/HashMe.App/HashMe.App.csproj
          dotnet restore tests/HashMe.Core.Tests/HashMe.Core.Tests.csproj
      - name: Build
        shell: pwsh
        run: |
          dotnet build src/HashMe.Core/HashMe.Core.csproj -c Release --no-restore -p:UseSharedCompilation=false
          dotnet build src/HashMe.App/HashMe.App.csproj -c Release --no-restore -p:UseSharedCompilation=false
          dotnet build tests/HashMe.Core.Tests/HashMe.Core.Tests.csproj -c Release --no-restore -p:UseSharedCompilation=false
      - name: Test
        run: dotnet run --project tests/HashMe.Core.Tests -c Release --no-build
